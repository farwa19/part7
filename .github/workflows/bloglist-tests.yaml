name: Bloglist tests

on:
  push:

    branches: [main] 
jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      TEST_MONGODB_URI: ${{ secrets.TEST_MONGODB_URI }}
      SECRET: ${{ secrets.SECRET }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install app dependencies
        working-directory: bloglist/blog
        run: npm ci

      - name: Install test dependencies
        working-directory: bloglist-tests
        run: npm ci

      - name: Validate test database secret
        shell: bash
        run: |
          if [[ -z "$TEST_MONGODB_URI" ]]; then
            echo "TEST_MONGODB_URI is not configured in repository secrets."
            exit 1
          fi
          if [[ ! "$TEST_MONGODB_URI" =~ ^mongodb(\+srv)?:// ]]; then
            echo "TEST_MONGODB_URI must start with mongodb:// or mongodb+srv://."
            exit 1
          fi
          if [[ -z "$SECRET" ]]; then
            echo "SECRET is not configured in repository secrets."
            exit 1
          fi

      - name: Install Playwright browsers
        working-directory: bloglist-tests
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: bloglist-tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: bloglist-tests/playwright-report/
          retention-days: 14
